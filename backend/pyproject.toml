[project]
name = "ai-interviewer-backend"
version = "0.1.0"
description = "AI Powered Adaptive Interview System Backend"
requires-python = ">=3.11"

dependencies = [
    "faiss-cpu>=1.14.2",
    "fastapi>=0.136.3",
    "groq>=1.4.0",
    "langchain>=1.3.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.2",
    "motor>=3.7.1",
    "pydantic-settings>=2.14.1",
    "pymongo>=4.17.0",
    "pypdf>=6.12.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.5.1",
    "uvicorn>=0.48.0",
    "voyageai>=0.3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
